name: Deployer le serveur d'achats (Firebase Functions)

on:
  workflow_dispatch:
  push:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifier les secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          missing=""
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$STRIPE_SECRET_KEY" ]        || missing="$missing STRIPE_SECRET_KEY"
          
          [ -n "$SITE_URL" ]                 || missing="$missing SITE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Secrets introuvables :$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Secrets : OK"

      - name: Installer les dependances du serveur
        working-directory: functions
        run: npm install --omit=dev

      - name: Ecrire la configuration du serveur
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          {
            echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
            echo "SITE_URL=$SITE_URL"
          } > functions/.env

      - name: Cle du compte de service
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

      - name: Deployer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: npx --yes firebase-tools@latest deploy --only functions --project xidata-strategie-f598a --non-interactive
