
name: Build XIDATA Android

on:
  workflow_dispatch:
  push:
    branches:
      - android-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dependances
        run: npm install

      - name: Verifier Capacitor
        run: npx cap config

      - name: Preparer le jeu
        run: npm run build

      - name: Creer le projet Android
        run: npx cap add android

      - name: Generer les icones Android
        run: npx @capacitor/assets generate --android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Installer la signature permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/xidata-release.p12
          chmod 600 android/app/xidata-release.p12

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          if "signingConfigs {" in content:
              raise SystemExit("Une configuration de signature existe déjà.")

          signing = """
              signingConfigs {
                  release {
                      storeFile file("xidata-release.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """

          pattern = r'(?m)^(\s*)buildTypes\s*\{'
          match = re.search(pattern, content)

          if not match:
              raise SystemExit("Bloc buildTypes introuvable.")

          indent = match.group(1)
          signing = signing.replace("\n              ", "\n" + indent + "    ")
          signing = signing.replace("\n          ", "\n" + indent)

          content = content[:match.start()] + signing + "\n" + content[match.start():]

          pattern = r'(?m)^(\s*buildTypes\s*\{\s*\n)(\s*)release\s*\{'
          replacement = (
              r'\1\2release {' +
              '\n' + r'\2    signingConfig signingConfigs.release'
          )

          content, count = re.subn(pattern, replacement, content, count=1)

          if count != 1:
              raise SystemExit("Bloc release introuvable.")

          path.write_text(content)
          print("Signature permanente configurée.")
          PY

      - name: Compiler APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: Publier APK Release
        uses: actions/upload-artifact@v4
        with:
          name: XIDATA-STRATEGIE-RELEASE
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publier APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: XIDATA-STRATEGIE-DEBUG
          path: android/app/build/outputs/apk/debug/app-debug.apk
