
name: Build XIDATA Android

on:
  workflow_dispatch:
  push:
    branches:
      - android-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dependances
        run: npm install

      - name: Verifier les fichiers Capacitor
        run: |
          echo "Contenu du dossier :"
          ls -la
          echo "Configuration Capacitor :"
          cat capacitor.config.json
          echo "Configuration détectée :"
          npx cap config

      - name: Preparer le jeu
        run: npm run build

      - name: Creer le projet Android
        run: npx cap add android

      - name: Generer les icones Android
        run: npx capacitor-assets generate   
--android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: XIDATA-STRATEGIE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
